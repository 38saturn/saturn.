  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - saturn.</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="entete">
      <nav class="barre">
        <a class="logo" href="index.html">saturn.</a>

        </ul>
      </nav>
    </header>

    <main>
      <section class="formulaire-page">
        <h1>Contact</h1>
        <form class="formulaire">
          <div class="champ">
            <label for="nom-prenom">NOM, Prénom</label>
            <input type="text" id="nom-prenom" name="nom-prenom" autocomplete="name" required>
          </div>
          <div class="champ">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="champ">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="bouton" type="submit">Envoyer</button>
        </form>
      </section>
    </main>

    <footer class="pied">
      <p>

    </footer>
